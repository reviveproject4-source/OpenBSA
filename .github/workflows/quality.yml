name: OpenBSA quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.I | re.S)
          inline_scripts = [script for script in scripts if script.strip()]
          if not inline_scripts:
              raise SystemExit("No inline JavaScript found in web/index.html")
          Path("/tmp/openbsa-inline.js").write_text("\n".join(inline_scripts), encoding="utf-8")
          PY
      - name: Validate JavaScript syntax
        run: node --check /tmp/openbsa-inline.js

  postgres-rls:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run PostgreSQL tenant-isolation tests
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/rls-isolation.sql
