name: OpenBSA quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.I | re.S)
          inline_scripts = [script for script in scripts if script.strip()]
          if not inline_scripts:
              raise SystemExit("No inline JavaScript found in web/index.html")
          Path("/tmp/openbsa-inline.js").write_text("\n".join(inline_scripts), encoding="utf-8")
          PY
      - name: Validate JavaScript syntax
        run: node --check /tmp/openbsa-inline.js

  postgres-rls:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract SQL from the OpenBSA RLS blueprint
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path("06-edge-cases-and-anti-failure/03-multi-tenant-data-isolation-rls.md").read_text(encoding="utf-8")
          section_marker = "## 4. Tenant context and policy example"
          if section_marker not in source:
              raise SystemExit("RLS blueprint section 4 was not found")
          section = source.split(section_marker, 1)[1]
          fence = chr(96) * 3
          blocks = re.findall(re.escape(fence) + r"sql\s*(.*?)" + re.escape(fence), section, flags=re.I | re.S)
          sql = next(
              (block.strip() for block in blocks
               if "CREATE TABLE tenants" in block and "CREATE POLICY invoice_tenant_isolation" in block),
              None,
          )
          if not sql:
              raise SystemExit("Executable tenant table and RLS policy SQL was not found in section 4")
          Path("/tmp/openbsa-rls-blueprint.sql").write_text(sql + "\n", encoding="utf-8")
          PY
      - name: Run PostgreSQL tenant-isolation tests
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/rls-isolation.sql
